  const rate=getTripRate(trip);const sym=trip.currencySymbol||'¥';
  const tripStones=APP.stones.filter(st=>trip.stoneIds.includes(st.id)&&st.status==='on_trip');
  const list=tripStones.map(st=>{
    const col=getStoneColor(st.name);const sel=st.id===stoneId;
    return`<div id="tc-${st.id}" onclick="toggleTripCombineSelect('${st.id}')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);margin-bottom:6px;border:2px solid ${sel?'var(--primary)':'var(--border)'};background:${sel?'var(--primary-glow)':'var(--surface)'};cursor:pointer">
      <div style="width:18px;height:18px;border-radius:50%;border:2px solid ${sel?'var(--primary)':'var(--border)'};background:${sel?'var(--primary)':'transparent'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;flex-shrink:0">${sel?'✓':''}</div>
      <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
      <div style="flex:1"><div style="font-size:13px;font-weight:700">${normalizeStoneType(st.name)}</div><div style="font-size:11px;color:var(--text3)">${st.code} · ${st.weight||'?'} ct</div></div>
      <div style="font-size:12px;color:var(--primary)">${st.minLKR?'Rs.'+st.minLKR.toLocaleString():''}</div>
    </div>`;
  }).join('');
  showModal('Combine Stones in Trip',`
    <div id="tc-count" style="font-size:13px;color:var(--primary);font-weight:700;margin-bottom:10px">1 selected</div>
    <div style="max-height:280px;overflow-y:auto">${list}</div>
    <div class="form-group" style="margin-top:12px"><label class="form-label">Lot Name *</label><input class="form-input" id="tc-name" placeholder="e.g. Spinel Lot, Mixed Lot…"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Code</label><input class="form-input" id="tc-code" placeholder="LOT-001"></div>
      <div class="form-group"><label class="form-label">Min Price (LKR)</label><input class="form-input" id="tc-price" type="number" placeholder="Optional"></div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal();_tripCombineMode=false">Cancel</button><button class="btn btn-primary" style="flex:1" onclick="submitTripCombine()">Combine</button>`,true);
}
function toggleTripCombineSelect(id){
  const idx=_tripCombineSelected.indexOf(id);
  if(idx>-1)_tripCombineSelected.splice(idx,1);else _tripCombineSelected.push(id);
  const el=document.getElementById('tc-'+id);const sel=_tripCombineSelected.includes(id);
  if(el){el.style.borderColor=sel?'var(--primary)':'var(--border)';el.style.background=sel?'var(--primary-glow)':'var(--surface)';el.querySelector('div').style.background=sel?'var(--primary)':'transparent';el.querySelector('div').style.borderColor=sel?'var(--primary)':'var(--border)';el.querySelector('div').textContent=sel?'✓':'';}
  const cnt=document.getElementById('tc-count');if(cnt)cnt.textContent=`${_tripCombineSelected.length} selected`;
}
function submitTripCombine(){
  if(_tripCombineSelected.length<2){toast('Select at least 2 stones','error');return;}
  const name=document.getElementById('tc-name').value.trim();if(!name){toast('Lot name required','error');return;}
  const stones=_tripCombineSelected.map(id=>APP.stones.find(s=>s.id===id)).filter(Boolean);
  const totalW=stones.reduce((a,s)=>a+(parseFloat(s.weight)||0),0);
  const trip=APP.trips.find(t=>t.id===_tripCombineTripId);
  const lot={id:uid(),name,trt:null,weight:totalW,weightUnit:'ct',code:document.getElementById('tc-code').value.trim(),supplierId:stones[0].supplierId||null,minLKR:document.getElementById('tc-price').value?parseInt(document.getElementById('tc-price').value):null,notes:'Combined from: '+stones.map(s=>s.code).join(', '),isLot:true,status:'on_trip',tripId:_tripCombineTripId,soldPrice:null,soldCurrency:null,soldCustomerId:null,history:[{action:'created',date:today(),note:'Combined from '+stones.length+' stones in '+(trip?trip.name:'trip')}],createdAt:today(),updatedAt:today()};
  if(trip)trip.stoneIds.push(lot.id);
  APP.stones.push(lot);
  stones.forEach(s=>{s.status='combined';s.tripId=null;s.updatedAt=today();s.history.push({action:'combined',date:today(),note:'Combined into '+name});if(trip){const idx=trip.stoneIds.indexOf(s.id);if(idx>-1)trip.stoneIds.splice(idx,1);}});
  _tripCombineSelected=[];_tripCombineMode=false;_tripCombineTripId=null;
  saveDB();closeModal();renderView(currentView);updateTripBanner();toast(`${name} created — stays on ${trip?trip.name:'trip'}`);
}

function initFirebase(){

    if(typeof firebase==='undefined'){console.warn('Firebase SDK not loaded');return;}

    _fs=firebase.firestore();

function setSyncStatus(state){
  const el=document.getElementById('sync-indicator');if(!el)return;
  if(state==='ok'){el.textContent='☁';el.title='Saved to cloud';el.style.color='var(--green)';}
  else if(state==='err'){el.textContent='⚠';el.title='Sync failed — tap to retry';el.style.color='var(--gold)';}
  else if(state==='loading'){el.textContent='↻';el.title='Syncing…';el.style.color='var(--text3)';}
  else{el.textContent='☁';el.style.color='var(--text3)';}
}
async function syncFirestore(){
  if(!_fs){setSyncStatus('err');return;}
  setSyncStatus('loading');
  try{
    const doc=await _fs.collection('safa_gems').doc('main').get();
    if(doc.exists){
      const remote=doc.data();
      if(remote&&remote.stones&&remote.stones.length){
        APP=remote;
        ['stones','suppliers','customers','trips','sales'].forEach(k=>{if(!Array.isArray(APP[k]))APP[k]=[];});
        if(!APP.settings)APP.settings={};
        _repairTripStones();
        try{localStorage.setItem(DB_KEY,JSON.stringify(APP));}catch(e){}
        await _fs.collection('safa_gems').doc('main').set(JSON.parse(JSON.stringify(APP)));
        renderView(currentView);updateTripBanner();
      }else{
        await _fs.collection('safa_gems').doc('main').set(JSON.parse(JSON.stringify(APP)));
      }
    }else{
      await _fs.collection('safa_gems').doc('main').set(JSON.parse(JSON.stringify(APP)));
    }
    setSyncStatus('ok');
  }catch(e){
    console.warn('Firestore sync error:',e);
    setSyncStatus('err');
  }
}
